# Environment for the conda-forge-GNU-cmake-latest job in .gitlab-ci.yml.
# No pixi.lock is committed, so that every CI run solves for the latest releases on
# conda-forge that are inside of the bounds, in particular the latest CMake 4 release.
# The upper bounds keep a new major release of a dependency from breaking the job, and
# need to be raised by hand to follow one (e.g. CMake 5). This can be done with
# `pixi upgrade --manifest-path CI/conda-forge/pixi.toml`, which rewrites the bounds
# in this file for the latest releases.
[workspace]
name = "hepmc3-ci-conda-forge"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64"]

[dependencies]
# The lower bounds are the versions that this job was first verified with, so that the
# solve fails instead of silently falling back to older releases.
# The bound on cmake must be at least the <policy_max> given to cmake_minimum_required,
# as otherwise the job does not test the upper end of the policy range.
cmake = ">=4.4.0,<5"
make = ">=4.4.0,<5"
# cxx-compiler brings in gcc, which the standalone examples use as CMake enables C for
# them by default. The Fortran compiler is for the optional Fortran examples (Pythia6,
# HEPEVT wrapper), which are skipped without one.
cxx-compiler = ">=2.0.0,<3"
fortran-compiler = ">=2.0.0,<3"
ccache = ">=4.14.1,<5"
python = ">=3.14.8,<3.15"
numpy = ">=2.5.4,<3"
zstandard = ">=0.25.0,<0.26"
root = ">=6.40.4,<7"
protobuf = ">=7.35.1,<8"
libprotobuf = ">=7.35.1,<8"
pythia8 = ">=8.312,<9"
hepmc2 = ">=2.6.11,<3"
graphviz = ">=14.1.2,<15"
doxygen = ">=1.18.0,<2"
zlib = ">=1.3.2,<2"
xz = ">=5.8.3,<6"
bzip2 = ">=1.0.8,<2"
zstd = ">=1.5.7,<2"
